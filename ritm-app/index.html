<html lang="ru" data-design="aurora">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#06060d" />
    <meta name="description" content="Планировщик задач и недели. Работает без интернета." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Ритм" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2214%22%20fill%3D%22%230f766e%22/%3E%3Cg%20fill%3D%22%23fff%22%3E%3Crect%20x%3D%2215%22%20y%3D%2226%22%20width%3D%228%22%20height%3D%2222%22%20rx%3D%224%22/%3E%3Crect%20x%3D%2228%22%20y%3D%2214%22%20width%3D%228%22%20height%3D%2234%22%20rx%3D%224%22/%3E%3Crect%20x%3D%2241%22%20y%3D%2232%22%20width%3D%228%22%20height%3D%2216%22%20rx%3D%224%22/%3E%3C/g%3E%3C/svg%3E" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <title>Ритм</title>
    <script>
      // Дизайн и тема до загрузки приложения, чтобы не мигало. Те же правила, что в src/designs/designs.ts.
      try {
        var d = localStorage.getItem('ritm-design') || 'aurora'
        var t = localStorage.getItem('ritm-theme') || 'system'
        var dark = d === 'aurora' || (d === 'mono' && (t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)))
        document.documentElement.dataset.design = d
        if (dark) document.documentElement.classList.add('dark')
      } catch (e) {
        document.documentElement.dataset.design = 'aurora'
        document.documentElement.classList.add('dark')
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
